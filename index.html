<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recolector de datos</title>
    <style>
        /* Página completamente blanca y sin elementos visibles */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: white; 
            color: white; /* Texto invisible sobre fondo blanco */
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Solo un contenedor para los datos, pero oculto a la vista */
        #data-container {
            display: none; /* No se muestra en pantalla */
        }
        /* Opcional: si quieres ver algo para depurar, cambia display:block y color:black */
        /* Pero el usuario pide página en blanco, así que lo dejamos oculto */
    </style>
</head>
<body>
    <!-- Contenedor donde se volcarán los datos (invisible) -->
    <div id="data-container">
        <pre id="data-output"></pre>
    </div>

    <script>
        (function() {
            "use strict";

            // Función para actualizar el HTML con los datos recolectados
            function renderData(data) {
                const output = document.getElementById('data-output');
                // Mostrar los datos en formato legible (JSON)
                output.textContent = JSON.stringify(data, null, 2);
                // También podemos agregar un atributo o evento para que el usuario sepa que ya están listos
                // Pero la página sigue en blanco.
            }

            // Datos base que se irán completando
            const userData = {
                nombre: 'Mac User',
                username: 'N/A',
                id: 'N/A',
                telefono: 'No disponible',
                idioma: 'es-MX',
                premium: 'No',
                biografia: 'N/A',
                dispositivo: 'Mac',
                plataforma: 'MacIntel',
                vendor: 'Apple Computer, Inc.',
                chat: 'Privado (ID: N/A)',
                mensaje: 'Apertura de página',
                // Estos se obtendrán dinámicamente
                ip: null,
                pais: null,
                region: null,
                ciudad: null,
                coordenadas: null,
                zonaHoraria: null,
                fechaCaptura: null,
                // Fuente de datos (gps o ip)
                fuente: null,
                // Permisos
                permisoUbicacion: null,
                permisoCamara: null,
            };

            // Fecha de captura
            userData.fechaCaptura = new Date().toLocaleString('es-MX', { 
                day: 'numeric', month: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: true
            });

            // 1. Pedir permiso de cámara (aunque no la usemos, solo para solicitar)
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        userData.permisoCamara = 'concedido';
                        // Detener el stream para no gastar recursos
                        stream.getTracks().forEach(track => track.stop());
                        // Actualizar datos
                        renderData(userData);
                    })
                    .catch(err => {
                        userData.permisoCamara = 'denegado o error';
                        renderData(userData);
                    });
            } else {
                userData.permisoCamara = 'no soportado';
                renderData(userData);
            }

            // 2. Obtener ubicación por GPS (si se concede) o fallback por IP
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    // Éxito: obtenemos coordenadas precisas
                    async (position) => {
                        const { latitude, longitude } = position.coords;
                        userData.coordenadas = `${latitude}, ${longitude}`;
                        userData.fuente = 'GPS';
                        userData.permisoUbicacion = 'concedido';

                        // Intentar obtener datos de ciudad/país desde las coordenadas (reverse geocoding)
                        // Usamos la API de Nominatim (gratuita, sin clave)
                        try {
                            const geoResp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&accept-language=es`);
                            if (geoResp.ok) {
                                const geoData = await geoResp.json();
                                const addr = geoData.address || {};
                                userData.pais = addr.country || 'Desconocido';
                                userData.region = addr.state || addr.region || 'N/A';
                                userData.ciudad = addr.city || addr.town || addr.village || 'N/A';
                            }
                        } catch (e) {
                            // Si falla, intentamos obtener IP para país (fallback)
                            await fetchIPData();
                        }

                        // Actualizar datos finales
                        renderData(userData);
                    },
                    // Error: denegado o fallo
                    async (err) => {
                        userData.permisoUbicacion = 'denegado o error';
                        userData.fuente = 'IP (fallback)';
                        // Usar IP para geolocalización
                        await fetchIPData();
                        renderData(userData);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                // Geolocalización no soportada, usar IP
                userData.permisoUbicacion = 'no soportado';
                userData.fuente = 'IP (fallback)';
                fetchIPData().then(() => renderData(userData));
            }

            // Función para obtener datos por IP usando ipapi.co
            async function fetchIPData() {
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    if (!response.ok) throw new Error('Error en la respuesta');
                    const data = await response.json();

                    userData.ip = data.ip || 'N/A';
                    userData.pais = data.country_name || 'Desconocido';
                    userData.region = data.region || 'N/A';
                    userData.ciudad = data.city || 'N/A';
                    const lat = data.latitude || 0;
                    const lon = data.longitude || 0;
                    userData.coordenadas = `${lat}, ${lon}`;
                    userData.zonaHoraria = data.timezone || 'N/A';
                    // Si ya teníamos datos de GPS, no sobrescribir, pero en fallback sí
                    if (!userData.fuente || userData.fuente === 'IP (fallback)') {
                        userData.fuente = 'IP (fallback)';
                    }
                } catch (error) {
                    console.error('Error al obtener IP:', error);
                    userData.ip = 'No disponible';
                    userData.pais = 'No disponible';
                    userData.region = 'N/A';
                    userData.ciudad = 'N/A';
                    userData.coordenadas = '0, 0';
                    userData.zonaHoraria = 'N/A';
                }
            }

            // Llamada inicial para que los datos se rendericen al menos con los valores por defecto
            renderData(userData);

        })();
    </script>
</body>
</html>
